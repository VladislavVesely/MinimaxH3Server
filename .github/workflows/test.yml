name: Native controller tests and builds
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv .venv
      - name: Activate environment for subsequent steps
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
            echo "H3_TEST_PYTHON=$GITHUB_WORKSPACE/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
            echo "H3_TEST_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          fi
      - run: python -m pip install -e ".[test,packaging]"
      - run: python -m pip check
      - name: Full POSIX suite (remote daemon is Linux-only)
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - name: Windows controller, shared contracts, native ACL/security suite
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q tests/test_cli.py tests/test_windows_trust.py
          tests/test_ssh.py tests/test_controller_security.py tests/test_web_assets.py
          tests/test_domain.py tests/test_events.py tests/test_store.py
          tests/test_probe.py tests/test_profiles.py tests/test_backend_manifest.py
          tests/test_install_plan.py
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Full browser suites (real controller, test-only target boundaries)
        if: runner.os != 'Windows'
        run: npm test
        working-directory: tests/browser
      - name: Windows browser/controller setup (POSIX generation fixture excluded)
        if: runner.os == 'Windows'
        run: npx playwright test setup.spec.js
        working-directory: tests/browser
      - name: Native build and embedded payload verification
        run: python scripts/build_controller.py
      - name: Native launch, CLI, assets, authentication, shutdown
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/smoke_controller.py dist/h3-controller.exe
            powershell -NoProfile -Command '$env:H3_CONTROLLER = (Resolve-Path dist/h3-controller.exe); & ./scripts/deploy.ps1 --help; exit $LASTEXITCODE'
          else
            python scripts/smoke_controller.py dist/h3-controller
            H3_CONTROLLER="$PWD/dist/h3-controller" sh scripts/deploy.sh --help
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: h3-controller-${{ matrix.os }}
          path: |
            dist/h3-controller*
            dist/SHA256SUMS
            scripts/deploy.sh
            scripts/deploy.ps1
            src/h3server/backends/LICENSE.h3.txt
          if-no-files-found: error
