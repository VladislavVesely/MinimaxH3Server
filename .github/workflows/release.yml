name: Native release (unsigned)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/test.yml
  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h3-controller-*
          path: artifacts
      - name: Archive native artifacts and checksum archives
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil
          output = pathlib.Path('release')
          output.mkdir()
          sums = []
          for artifact in sorted(pathlib.Path('artifacts').iterdir()):
              # artifact upload does not preserve executable mode.
              for executable in artifact.rglob('h3-controller'):
                  executable.chmod(0o755)
              archive = pathlib.Path(shutil.make_archive(str(output / artifact.name), 'zip', artifact))
              sums.append(f'{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n')
          (output / 'SHA256SUMS').write_text(''.join(sums))
          PY
      - name: Publish only after native checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag
          --title "H3 Server $GITHUB_REF_NAME (experimental, unsigned)"
          --notes "Native controller checks passed in this workflow. Unsigned/not notarized. No Linux systemd/VM reboot/GPU/real MP4 certification is implied. Review README, license eligibility and acceptance checklist before deployment."
